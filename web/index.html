  <meta name="description" content="نظام إدارة ومتابعة وحسابات شركة إيليت جراند للتمريض المنزلي">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="إيليت جراند">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>إيليت جراند للتمريض المنزلي</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <style>
    body {
      background-color: #0A2540;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      text-align: center;
      direction: rtl;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #00D09C;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      margin: 0;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <h2>إيليت جراند للتمريض المنزلي</h2>
    <p>جاري تحميل النظام والمزامنة السحابية...</p>
  </div>
  <script>
    // Audio Notification Synthesizer (Crystal-clear chime, works 24/7 without external audio files)
    window._egAudioCtx = null;
    function getEgAudioCtx() {
      try {
        if (!window._egAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) window._egAudioCtx = new AudioCtx();
        }
        if (window._egAudioCtx && window._egAudioCtx.state === 'suspended') {
          window._egAudioCtx.resume();
        }
        return window._egAudioCtx;
      } catch (e) {
        return null;
      }
    }

    // Auto unlock on first user interaction anywhere
    ['click', 'touchstart', 'keydown'].forEach(function(evt) {
      document.addEventListener(evt, function() { getEgAudioCtx(); }, { passive: true });
    });

    window.playEliteGrandAlertSound = function() {
      try {
        const ctx = getEgAudioCtx();
        if (!ctx) return;

        const playTone = (freq, startTime, duration, volume) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(volume, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        };

        const now = ctx.currentTime + 0.03;
        // 3-Tone Bright Notification Chime (E5 -> A5 -> C#6)
        playTone(659.25, now, 0.28, 0.35);
        playTone(880.00, now + 0.11, 0.35, 0.40);
        playTone(1108.73, now + 0.22, 0.55, 0.45);
      } catch (err) {
        console.warn("Sound play error:", err);
      }
    };
  </script>
  <script>
    // Ensure clean cache and unregister old service workers on update
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    const bootstrapScript = document.createElement('script');
    bootstrapScript.src = 'flutter_bootstrap.js?v=' + Date.now();
    bootstrapScript.async = true;
    document.body.appendChild(bootstrapScript);
  </script>
</body>
</html>
