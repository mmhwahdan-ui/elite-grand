<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <base href="/elite-grand/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="نظام إدارة ومتابعة وحسابات شركة إيليت جراند للتمريض المنزلي">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="إيليت جراند">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>إيليت جراند للتمريض المنزلي</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <style>
    body {
      background-color: #0A2540;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      text-align: center;
      direction: rtl;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #00D09C;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      margin: 0;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <h2>إيليت جراند للتمريض المنزلي</h2>
    <p>جاري تحميل النظام والمزامنة السحابية...</p>
  </div>
  <script>
    // Audio Notification Synthesizer (Crystal-clear chime, works 24/7 without external audio files)
    window._egAudioCtx = null;
    function getEgAudioCtx() {
      try {
        if (!window._egAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) window._egAudioCtx = new AudioCtx();
        }
        if (window._egAudioCtx && window._egAudioCtx.state === 'suspended') {
          window._egAudioCtx.resume();
        }
        return window._egAudioCtx;
      } catch (e) {
        return null;
      }
    }

    // Auto unlock on first user interaction anywhere
    ['click', 'touchstart', 'keydown'].forEach(function(evt) {
      document.addEventListener(evt, function() { getEgAudioCtx(); }, { passive: true });
    });

    window.playEliteGrandAlertSound = function(soundType) {
      try {
        const ctx = getEgAudioCtx();
        if (!ctx) return;

        const playTone = (freq, startTime, duration, volume, waveType) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = waveType || 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(volume, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        };

        const now = ctx.currentTime + 0.03;
        const type = (soundType || 'general').toString().toLowerCase();

        if (type === 'admin_chat') {
          // Loud Punchy Chime for Management Internal Chat (D5 -> A5 -> D6)
          playTone(587.33, now, 0.22, 0.85, 'triangle');
          playTone(880.00, now + 0.10, 0.25, 0.90, 'triangle');
          playTone(1174.66, now + 0.22, 0.45, 0.95, 'sine');
        } else if (type === 'opportunity') {
          // Loud Energetic Fanfare for New Case Offer (C5 -> E5 -> G5 -> C6)
          playTone(523.25, now, 0.20, 0.85, 'triangle');
          playTone(659.25, now + 0.11, 0.20, 0.85, 'triangle');
          playTone(783.99, now + 0.22, 0.25, 0.90, 'triangle');
          playTone(1046.50, now + 0.35, 0.60, 0.95, 'sine');
        } else if (type === 'admin_message') {
          // Loud Urgent Attention Alert for Admin message to Nurse (A5 -> E6)
          playTone(880.00, now, 0.25, 0.90, 'triangle');
          playTone(1318.51, now + 0.14, 0.55, 0.95, 'sine');
        } else if (type === 'weekly_settlement') {
          // Thursday Weekly Settlement Alert: Distinct Multi-Tone Cash & Accounting Bell
          playTone(523.25, now, 0.18, 0.85, 'triangle'); // C5
          playTone(659.25, now + 0.12, 0.18, 0.85, 'triangle'); // E5
          playTone(783.99, now + 0.24, 0.20, 0.90, 'triangle'); // G5
          playTone(1046.50, now + 0.36, 0.30, 0.95, 'sine'); // C6
          playTone(1318.51, now + 0.50, 0.60, 0.95, 'sine'); // E6
        } else {
          // Loud Bright 3-Tone Chime
          playTone(659.25, now, 0.28, 0.80, 'triangle');
          playTone(880.00, now + 0.11, 0.35, 0.85, 'triangle');
          playTone(1108.73, now + 0.22, 0.55, 0.90, 'sine');
        }
      } catch (err) {
        console.warn("Sound play error:", err);
      }
    };
  </script>
  <script>
    // Ensure clean cache and unregister old service workers on update
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    const bootstrapScript = document.createElement('script');
    bootstrapScript.src = 'flutter_bootstrap.js?v=1795368516031?v=' + Date.now();
    bootstrapScript.async = true;
    document.body.appendChild(bootstrapScript);
  </script>
</body>
</html>
